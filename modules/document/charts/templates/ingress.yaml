{{- if .Values.domainURL }}
{{- $host := .Values.domainURL }}
{{- if or (gt (len $host) 253) (not (regexMatch `^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)*[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$` $host)) }}
{{- fail "domainURL must be a domain without scheme, port or path" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "document.fullname" . }}
  labels:
    {{- include "document.labels" . | nindent 4 }}
    group: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: higress
    higress.io/resource-definer: higress
    higress.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: w7-letsencrypt-prod
    cert-manager.io/renew-before: 30m
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Release.Name }}-tls-secret
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /doc
            pathType: Prefix
            backend:
              service:
                name: {{ include "document.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
