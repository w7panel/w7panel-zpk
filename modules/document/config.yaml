app:
  name: document
  env: ${APP_ENV-release}
  server: http
server:
  http:
    host: ${DOCUMENT_LISTEN_HOST-127.0.0.1}
    port: ${DOCUMENT_PORT-8001}
log:
  default:
    driver: stack
    channels:
      - file
      - console
  file:
    driver: file
    path: run.log
    level: info
  console:
    driver: console
    level: debug
database:
  default:
    driver: sqlite
    db_name: ${DOCUMENT_DB_PATH-/tmp/document/document.db}
    prefix: ims_
    show_sql: false
zpk:
  base_url: ${DOCUMENT_ZPK_URL-http://127.0.0.1:8000/zpk}
session:
  secret: ${DOCUMENT_SESSION_SECRET-document-session-secret}
cookie:
  path: /zpk/document
  http_only: true
  secure: ${DOCUMENT_COOKIE_SECURE-true}
  expires: ${DOCUMENT_SESSION_MAX_AGE-86400}
  same_site: lax
document:
  storage_path: ${DOCUMENT_STORAGE_PATH-/tmp/document/objects}
  read_only: ${DOCUMENT_READ_ONLY-false}
