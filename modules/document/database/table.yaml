relation:
  - table: document_category
    column:
      id:
        tag:
          gorm:
            autoIncrement: "true"
      identifie:
        tag:
          gorm:
            type: "varchar(96)"
            index: "document_category_identifie,unique"
      name:
        tag:
          gorm:
            type: "varchar(255)"
      description:
        tag:
          gorm:
            type: "text"
  - table: document_library
    column:
      id:
        tag:
          gorm:
            autoIncrement: "true"
      category:
        tag:
          gorm:
            type: "varchar(96)"
            index: "document_library_ref,unique"
      identifie:
        tag:
          gorm:
            type: "varchar(96)"
            index: "document_library_ref,unique"
      name:
        tag:
          gorm:
            type: "varchar(255)"
      description:
        tag:
          gorm:
            type: "text"
      user_id:
        tag:
          gorm:
            index: "document_library_owner"
      public:
        tag:
          gorm:
            default: "0"
      protected:
        tag:
          gorm:
            default: "0"
  - table: document_file
    column:
      id:
        tag:
          gorm:
            autoIncrement: "true"
      library_id:
        tag:
          gorm:
            index: "document_file_path,unique"
      path:
        tag:
          gorm:
            type: "varchar(255)"
            index: "document_file_path,unique"
      title:
        tag:
          gorm:
            type: "varchar(255)"
      storage_key:
        tag:
          gorm:
            type: "varchar(255)"
