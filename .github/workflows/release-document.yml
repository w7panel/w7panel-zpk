name: Release document

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      IMAGE_PUSH_REGISTRY: ${{ vars.IMAGE_PUSH_REGISTRY || 'ghcr.io' }}
      HELM_PACKAGE_IMAGE_REGISTRY: ${{ vars.HELM_PACKAGE_IMAGE_REGISTRY || 'ghcr.registry.cdn.w7.cc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish document image and build packages
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          IMAGE_NAME="${GITHUB_REPOSITORY,,}-document"

          make -C modules/document publish \
            BUILD_CC=musl-gcc \
            BUILD_CXX=g++ \
            IMAGE_REPOSITORY="${IMAGE_PUSH_REGISTRY}/${IMAGE_NAME}" \
            IMAGE_TAG="${RELEASE_TAG}" \
            LOCAL_IMAGE="w7-zpkdocument:${RELEASE_TAG}" \
            HELM_PACKAGE_IMAGE_REPOSITORY="${HELM_PACKAGE_IMAGE_REGISTRY}/${IMAGE_NAME}" \
            HELM_CHART_VERSION="${RELEASE_VERSION}" \
            HELM_APP_VERSION="${RELEASE_TAG}"

      - name: Upload document packages
        uses: actions/upload-artifact@v4
        with:
          name: w7-zpkdocument
          path: |
            modules/document/builder/w7-zpkdocument-*.tgz
          if-no-files-found: error
          retention-days: 7
