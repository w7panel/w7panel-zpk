{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zpk.serviceAccountName" . }}-role
rules:
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "daemonsets", "statefulsets" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  - apiGroups: [ "" ]
    resources: [ "namespaces" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "batch" ]
    resources: [ "cronjobs" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  - apiGroups: [ "appgroup.w7.cc" ]    # 替换为您的 API 组
    resources: [ "appgroups", "appgroups/status" ]  # 根据实际需要添加子资源
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ] # 按需调整权限
{{- end }}
