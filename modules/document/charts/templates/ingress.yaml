{{- if .Values.domainURL }}
{{- $domain := urlParse .Values.domainURL }}
{{- if or (not (has $domain.scheme (list "http" "https"))) (empty $domain.host) (not (empty $domain.userinfo)) (not (has $domain.path (list "" "/"))) (not (empty $domain.query)) (not (empty $domain.fragment)) }}
{{- fail "domainURL must be an HTTP(S) origin without credentials, path, query or fragment" }}
{{- end }}
{{- $host := regexReplaceAll ":[0-9]+$" $domain.host "" | lower }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "document.fullname" . }}
  labels:
    {{- include "document.labels" . | nindent 4 }}
    group: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: higress
    higress.io/resource-definer: higress
    higress.io/ssl-redirect: "false"
    {{- if eq $domain.scheme "https" }}
    cert-manager.io/cluster-issuer: w7-letsencrypt-prod
    cert-manager.io/renew-before: 30m
    {{- end }}
spec:
  ingressClassName: higress
  {{- if eq $domain.scheme "https" }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Release.Name }}-tls-secret
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /doc
            pathType: Prefix
            backend:
              service:
                name: {{ include "document.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
