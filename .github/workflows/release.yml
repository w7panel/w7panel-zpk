name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-document:
    uses: ./.github/workflows/release-document.yml
    permissions:
      contents: read
      packages: write

  publish:
    needs: publish-document
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      ZPK_HOST: zpk.w7.cc
      ZPK_ARTIFACT: w7-zpkv2
      IMAGE_PUSH_REGISTRY: ${{ vars.IMAGE_PUSH_REGISTRY || 'ghcr.io' }}
      HELM_PACKAGE_IMAGE_REGISTRY: ${{ vars.HELM_PACKAGE_IMAGE_REGISTRY || 'ghcr.registry.cdn.w7.cc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image and Helm package
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          IMAGE_REPOSITORY="${IMAGE_PUSH_REGISTRY}/${IMAGE_NAME}"
          HELM_PACKAGE_IMAGE_REPOSITORY="${HELM_PACKAGE_IMAGE_REGISTRY}/${IMAGE_NAME}"

          make publish \
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY}" \
            IMAGE_TAG="${RELEASE_TAG}" \
            HELM_PACKAGE_IMAGE_REPOSITORY="${HELM_PACKAGE_IMAGE_REPOSITORY}" \
            HELM_PACKAGE_IMAGE_TAG="${RELEASE_TAG}" \
            HELM_CHART_VERSION="${RELEASE_VERSION}" \
            HELM_APP_VERSION="${RELEASE_TAG}"

      - name: Build zpk CLI
        working-directory: cli
        run: make build-compress

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Download document packages
        uses: actions/download-artifact@v4
        with:
          name: w7-zpkdocument
          path: ${{ runner.temp }}/document-release

      - name: Upload CLI assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/bin/zpk_darwin_amd64_v2
            cli/bin/zpk_linux_amd64_v2
            cli/bin/zpk_windows_amd64_v2.exe

      - name: Update latest tag
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

      - name: Upload CLI assets to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: |
            cli/bin/zpk_darwin_amd64_v2
            cli/bin/zpk_linux_amd64_v2
            cli/bin/zpk_windows_amd64_v2.exe
          overwrite_files: true
          make_latest: false

      - name: Publish zpk artifact
        env:
          ZPK_DOCKER_USERNAME: ${{ secrets.ZPK_DOCKER_USERNAME }}
          ZPK_DOCKER_PASSWORD: ${{ secrets.ZPK_DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ZPK_DOCKER_USERNAME}" ]; then
            echo "ZPK_DOCKER_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${ZPK_DOCKER_PASSWORD}" ]; then
            echo "ZPK_DOCKER_PASSWORD secret is required"
            exit 1
          fi

          HELM_PACKAGE="$(ls charts/zpk-*.tgz | head -n 1)"
          if [ -z "${HELM_PACKAGE}" ]; then
            echo "helm package not found under charts/"
            exit 1
          fi
          FRONTEND_DIRECTORY="ui/dist"
          if [ ! -d "${FRONTEND_DIRECTORY}" ]; then
            echo "frontend directory not found at ${FRONTEND_DIRECTORY}"
            exit 1
          fi

          PUBLISH_DIRECTORY="$(mktemp -d "${RUNNER_TEMP}/zpk-release.XXXXXX")"
          DOCUMENT_PACKAGE_DIRECTORY="${RUNNER_TEMP}/document-release"
          DOCUMENT_HELM_PACKAGE="${DOCUMENT_PACKAGE_DIRECTORY}/w7-zpkdocument-${GITHUB_REF_NAME#v}.tgz"
          mkdir -p "${PUBLISH_DIRECTORY}/helm" "${PUBLISH_DIRECTORY}/document-helm"
          tar -xzf "${HELM_PACKAGE}" -C "${PUBLISH_DIRECTORY}/helm"
          tar -xzf "${DOCUMENT_HELM_PACKAGE}" -C "${PUBLISH_DIRECTORY}/document-helm"

          ZPK="./cli/bin/zpk_linux_amd64_v2"
          "${ZPK}" login --username="${ZPK_DOCKER_USERNAME}" --password="${ZPK_DOCKER_PASSWORD}" --host="${ZPK_HOST}"
          "${ZPK}" app pull "${ZPK_ARTIFACT}" --path="${PUBLISH_DIRECTORY}/app"
          test -f "${PUBLISH_DIRECTORY}/app/apps/w7-zpkdocument/manifest.yaml"
          "${ZPK}" app update helm --path="${PUBLISH_DIRECTORY}/app" --dir="${PUBLISH_DIRECTORY}/helm"
          "${ZPK}" app update frontend --path="${PUBLISH_DIRECTORY}/app" --dir="${FRONTEND_DIRECTORY}"
          "${ZPK}" app update helm --path="${PUBLISH_DIRECTORY}/app" --app=w7-zpkdocument --dir="${PUBLISH_DIRECTORY}/document-helm"
          "${ZPK}" app push --path="${PUBLISH_DIRECTORY}/app" --publish
