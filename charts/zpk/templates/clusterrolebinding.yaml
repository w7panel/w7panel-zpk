{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zpk.serviceAccountName" . }}-role-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "zpk.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "zpk.serviceAccountName" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
