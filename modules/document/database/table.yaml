relation:
  - table: document_library
    column:
      id:
        tag:
          gorm:
            autoIncrement: "true"
      namespace:
        tag:
          gorm:
            type: "varchar(96)"
            index: "document_library_ref,unique"
      identifie:
        tag:
          gorm:
            type: "varchar(96)"
            index: "document_library_ref,unique"
      name:
        tag:
          gorm:
            type: "varchar(255)"
      description:
        tag:
          gorm:
            type: "text"
      user_id:
        tag:
          gorm:
            index: "document_library_owner"
      username:
        tag:
          gorm:
            type: "varchar(255)"
            default: "''"
      public:
        tag:
          gorm:
            default: "0"
      deleted_at:
        type: gorm.DeletedAt
        tag:
          gorm:
            index: "document_library_deleted_at"
      protected:
        tag:
          gorm:
            default: "0"
  - table: document_file
    column:
      deleted_at:
        type: gorm.DeletedAt
        tag:
          gorm:
            index: "document_file_deleted_at"
      id:
        tag:
          gorm:
            autoIncrement: "true"
      library_id:
        tag:
          gorm:
            index: "document_file_path,unique"
      path:
        tag:
          gorm:
            type: "varchar(255)"
            index: "document_file_path,unique"
      title:
        tag:
          gorm:
            type: "varchar(255)"
      storage_key:
        tag:
          gorm:
            type: "varchar(255)"
      protected:
        tag:
          gorm:
            default: "0"
