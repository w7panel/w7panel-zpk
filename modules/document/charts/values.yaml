image:
  repository: zpk.w7.cc/public/zpk-document
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# ZPK 创建站点时注入 cloudnoauth library 和此列表。
w7panelSidecars: []
w7panelArtifact:
  serviceAccountName: '{{ include "document.serviceAccountName" . }}'
  sharedSidecarResources: false

service:
  type: ClusterIP
  port: 8001

# ZPK 单次安装的 Service 为 default 命名空间下的 w7-zpkv2。
# 仅配置 origin，不包含 /zpk 等接口路径。
zpk:
  baseURL: "http://w7-zpkv2.default.svc.cluster.local:8000"
permission:
  # 留空时使用 zpk.baseURL。
  serverURL: "http://w7-zpkv2.default.svc.cluster.local:8000"

# 通过文档子应用启动参数引用主应用的 %DOMAIN_SSL_URL%，包含 http(s)://。
domainURL: ""

auth:
  tokenTTLSeconds: 86400

persistence:
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
