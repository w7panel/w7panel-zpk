{{- $name := include "zpk.registryJwtSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $rotateNonce := default "" .Values.global.registryJwt.rotateNonce -}}
{{- $currentNonce := "" -}}
{{- if $existing }}
  {{- $annotations := default (dict) $existing.metadata.annotations -}}
  {{- $currentNonce = default "" (index $annotations "zpk.w7.cc/registry-jwt-rotate-nonce") -}}
{{- end }}
{{- $shouldGenerate := true -}}
{{- if $existing }}
  {{- if eq $rotateNonce "" }}
    {{- $shouldGenerate = false -}}
  {{- else if eq $currentNonce $rotateNonce }}
    {{- $shouldGenerate = false -}}
  {{- end }}
{{- end }}
{{- $certPEM := "" -}}
{{- $keyPEM := "" -}}
{{- if $shouldGenerate }}
  {{- $ca := genCA .Values.global.registryJwt.commonName (.Values.global.registryJwt.validDays | int) -}}
  {{- $certPEM = $ca.Cert -}}
  {{- $keyPEM = $ca.Key -}}
{{- else }}
  {{- $certPEM = b64dec (index $existing.data "registry-cert.pem") -}}
  {{- $keyPEM = b64dec (index $existing.data "registry-key.pem") -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zpk.labels" . | nindent 4 }}
  annotations:
    zpk.w7.cc/registry-jwt-rotate-nonce: {{ $rotateNonce | quote }}
type: Opaque
data:
  registry-cert.pem: {{ $certPEM | b64enc }}
  registry-key.pem: {{ $keyPEM | b64enc }}
