app:
  name: document
  env: ${APP_ENV-release}
  server: http
server:
  http:
    host: ${DOCUMENT_LISTEN_HOST-127.0.0.1}
    port: ${DOCUMENT_PORT-8001}
log:
  default:
    driver: stack
    channels:
      - file
      - console
  file:
    driver: file
    path: run.log
    level: info
  console:
    driver: console
    level: debug
database:
  default:
    driver: sqlite
    db_name: ${DOCUMENT_DB_PATH-/tmp/document/document.db}
    prefix: ims_
    show_sql: false
zpk:
  base_url: ${DOCUMENT_ZPK_URL-http://127.0.0.1:8000}
permission:
  server_url: ${DOCUMENT_PERMISSION_SERVER_URL-http://127.0.0.1:8000}
auth:
  token_ttl_seconds: ${DOCUMENT_TOKEN_TTL_SECONDS-86400}
document:
  storage_path: ${DOCUMENT_STORAGE_PATH-/tmp/document/objects}
