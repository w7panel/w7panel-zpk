{{- if .Values.global.zpk.storageMigration.enabled }}
{{- $sourceClaimName := required "global.zpk.storageMigration.sourceClaimName is required" .Values.global.zpk.storageMigration.sourceClaimName -}}
{{- $targetClaimName := default (include "zpk.storageClaimName" .) .Values.global.zpk.storageMigration.targetClaimName -}}
{{- $preserveSourceClaim := true -}}
{{- if hasKey .Values.global.zpk.storageMigration "preserveSourceClaim" -}}
{{- $preserveSourceClaim = .Values.global.zpk.storageMigration.preserveSourceClaim -}}
{{- end -}}
{{- $sourceClaim := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $sourceClaimName -}}
{{- if and $preserveSourceClaim $sourceClaim (ne $sourceClaimName $targetClaimName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $sourceClaimName | quote }}
  labels:
    {{- include "zpk.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  {{- toYaml $sourceClaim.spec | nindent 2 }}
{{- end }}
{{- end }}
