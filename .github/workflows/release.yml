name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      ZPK_HOST: zpk.w7.cc
      ZPK_ARTIFACT: w7-zpkv2
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'zpk.w7.cc' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip

      - name: Docker login
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Publish image and Helm package
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          make publish IMAGE_TAG="${RELEASE_TAG}" HELM_CHART_VERSION="${RELEASE_VERSION}" HELM_APP_VERSION="${RELEASE_TAG}"

      - name: Build zpk CLI
        working-directory: cli
        run: make build-compress

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build
          cd dist
          zip -r ../frontend.zip .

      - name: Upload CLI assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/bin/*

      - name: Update latest tag
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

      - name: Upload CLI assets to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: cli/bin/*
          overwrite_files: true
          make_latest: false

      - name: Publish zpk artifact
        env:
          ZPK_DOCKER_USERNAME: ${{ secrets.ZPK_DOCKER_USERNAME }}
          ZPK_DOCKER_PASSWORD: ${{ secrets.ZPK_DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ZPK_DOCKER_USERNAME}" ]; then
            echo "ZPK_DOCKER_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${ZPK_DOCKER_PASSWORD}" ]; then
            echo "ZPK_DOCKER_PASSWORD secret is required"
            exit 1
          fi

          HELM_PACKAGE="$(ls charts/zpk-*.tgz | head -n 1)"
          if [ -z "${HELM_PACKAGE}" ]; then
            echo "helm package not found under charts/"
            exit 1
          fi
          FRONTEND_PACKAGE="ui/frontend.zip"
          if [ ! -f "${FRONTEND_PACKAGE}" ]; then
            echo "frontend package not found at ${FRONTEND_PACKAGE}"
            exit 1
          fi

          ZPK="./cli/bin/zpk_linux_amd64"
          "${ZPK}" login --username="${ZPK_DOCKER_USERNAME}" --password="${ZPK_DOCKER_PASSWORD}" --host="${ZPK_HOST}"
          "${ZPK}" use --name="${ZPK_ARTIFACT}"
          "${ZPK}" attach add --path="${HELM_PACKAGE}" --type=helm
          "${ZPK}" attach add --path="${FRONTEND_PACKAGE}" --type=frontend
          "${ZPK}" push
